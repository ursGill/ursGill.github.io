<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOPI- Resume</title>

  <meta name="robots" content="noindex" />

  <style>
    :root {
      --bg: #0b0f16;
      --surface: #0f1720;
      --text: #e6eef8;
      --muted: #9fb0d1;
      --accent: #6ea6ff;
      --border: rgba(255,255,255,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* Top bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--text);
      background: transparent;
    }

    .btn.primary {
      background: var(--accent);
      color: #0b0f16;
      border-color: transparent;
    }

    /* Viewer */
    .viewer {
      height: calc(100vh - 52px);
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Fallback message */
    .fallback {
      display: none;
      padding: 24px;
      text-align: center;
    }

    .fallback p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 16px;
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <div class="title">Resume — GOPI</div>
    <div class="actions">
      <a
        href="assets/resume-gopi.pdf"
        class="btn primary"
        download
      >
        Download
      </a>
      <a href="/" class="btn">Back</a>
    </div>
  </div>

  <div class="viewer" id="viewer">
    <iframe
      src="assets/resume-gopi.pdf"
      title="Resume Preview"
      onerror="handlePreviewError()"
    ></iframe>
  </div>

  <div class="fallback" id="fallback">
    <p>
      Preview is not available on this device.
      You can download the resume directly.
    </p>
    <a
      href="assets/resume-gopi.pdf"
      class="btn primary"
      download
    >
      Download Resume
    </a>
  </div>

  <script>
    function handlePreviewError() {
      document.getElementById('viewer').style.display = 'none';
      document.getElementById('fallback').style.display = 'block';
    }
  </script>

</body>
</html>
